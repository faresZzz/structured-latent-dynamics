[project]
name = "sld"
version = "0.1.0"
description = "Structured latent dynamics in JEPA world models: when does explicit dynamical structure improve rollout stability, state sufficiency, and planning — at what compute cost per successful decision."
requires-python = ">=3.12"
dependencies = [
  "torch",
  "numpy",
  "matplotlib",
  # sld.viz.ingest returns tidy frames: a runtime dependency of the package,
  # not a dev extra -- `make figA` imports it.
  "pandas",
  "pyyaml",
  "tqdm",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=3.7",
  "pytest",
  "ipykernel",
  "ruff",
  "nb-clean>=4.0.1",
]

[project.scripts]
sld-factorial = "sld.experiments.factorial:main"
sld-gate = "sld.experiments.gate:main"
sld-d3-gate = "sld.experiments.oscillator_gold:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint.per-file-ignores]
# 2026-08-17 : les notebooks gardent leur style d'enseignement -- `a; b` pour
# les paires tracé/légende, `I` pour la matrice identité, lambdas et f-strings
# d'affichage. La gate est `ruff check .` = 0 ; src/ et tests/ restent sans
# exception.
"notebooks/*.ipynb" = ["E702", "E731", "E741", "F541"]
