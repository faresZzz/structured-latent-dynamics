[project]
name = "sld"
version = "0.1.0"
description = "Structured latent dynamics in JEPA world models: when does explicit dynamical structure improve rollout stability, state sufficiency, and planning — at what compute cost per successful decision."
requires-python = ">=3.12"
dependencies = [
  "torch",
  "numpy",
  "matplotlib",
  "pyyaml",
  "tqdm",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=3.7",
  "pytest",
  "ipykernel",
  "ruff",
  "nb-clean>=4.0.1",
]

[project.scripts]
sld-factorial = "sld.experiments.factorial:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
