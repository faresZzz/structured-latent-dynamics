# EXECUTED core grid under the backbone x structure factorial. This file is
# now the frozen record of the 30 cells that actually ran; it declares no
# cell that has not been executed. See PROTOCOL.md section 13 (Amendment 4,
# 2026-08-04), which supersedes the (ssm, on) arm this file used to carry.
#
# `structure` is architectural, never a numeric penalty -- but WHAT it means
# changed at Amendment 4. It used to mean `constrained: true` in
# koopman_ssm.py (alpha = -exp(nu), contractive). It now means the STRUCTURED
# TRANSITION -- lift psi, 2x2 rotation-scaling blocks, exact ZOH, projection
# pi -- with alpha FREE, realized by the `mlp_k`/`transformer_k`/`ssm_k`
# arms phase C built. mu_j stays 0 in every arm below.
#
# 2 datasets x 3 arms x 5 seeds = 30 declared cells, all 30 executed on
# 2026-07-31, filed in `results_amended/pendulum_core/` under the
# pre-migration `family`/`constraint` naming. All three are OFF arms.
#
# What this file used to declare and no longer does: a 4th arm pairing
# backbone ssm with the ON structure, mapping to `koopman_ssm` with
# `constrained: true`, i.e. the OLD definition of ON. Its 10 cells (1 arm x
# 2 datasets x 5 seeds) were NEVER EXECUTED -- no data for them exists
# anywhere in this repo -- and Amendment 4 withdraws them as superseded.
# This is the removal of a declaration, never of a result. (An earlier
# predecessor of this file, `pendulum_core_off.yaml`, carried a different
# 4th arm, `{family: koopman_ssm, constraint: off, constrained: false}` --
# the Koopman architecture WITHOUT its contraction, an ablation, not the
# structured cell. See git history for that arm. It has no cell on the
# backbone x structure axis either.)
#
# `results_root: results_amended` (PROTOCOL.md section 11.5, review round 2
# BLOCKER 1): the first execution of these 30 cells ran at 17:14 on
# 2026-07-31, and the amendment authorizing their 200-update budget was
# committed at 18:48 the same day. Later commitment does not retroactively
# pre-register a run -- section 11.2 states that rule and it applies to this
# repo's own convenience. The pre-amendment artifacts stay under `results/`
# as post-hoc diagnostics; a SEPARATE root is required so resume sentinels
# cannot silently adopt them.
#
# THIS ROOT IS NOW FROZEN. The full 3x2 grid (6 arms x 2 datasets x 5 seeds
# = 60 cells) is a NEW pre-registration writing to a NEW root, and it
# re-runs these OFF arms rather than reusing them -- they predate the
# structured code, and one figure must not mix two code versions under two
# pre-registrations. See PROTOCOL.md section 13.3. Nothing may be written
# into `results_amended` again.
exp_name: pendulum_core
datasets:
  ou:
    system:
      name: DampedPendulum
      params: {}
    regime:
      name: OURegime
      params:
        theta_ou: 1.0
    obs: null
    n_episodes: 64
    T: 100
    dt: 0.02
    seed: 0
  action_conditioned:
    system:
      name: DampedPendulum
      params: {}
    regime:
      name: ActionConditionedRegime
      params:
        K_gain:
        - - 0.8
          - 0.4
        sigma: 0.3
    obs: null
    n_episodes: 64
    T: 100
    dt: 0.02
    seed: 0
base:
  d_x: 2
  d_z: 4
  d_u: 1
  target_params: 10000
  epochs: 200
  step_subsample: 1.0
  results_root: results_amended
arms:
- backbone: mlp
  structure: 'off'
  overrides:
    mu_j: 0.0
    lr: 0.0001
- backbone: transformer
  structure: 'off'
  overrides:
    mu_j: 0.0
    lr: 0.0001
- backbone: ssm
  structure: 'off'
  overrides:
    mu_j: 0.0
    lr: 0.0003
seeds:
- 0
- 1
- 2
- 3
- 4
