# Grille D1 pre-enregistree (PROTOCOL.md): 2 datasets x 8 arms (4 families x
# off/on) x 5 seeds (PROTOCOL.md section 3) = 80 runs.
# Core cells retain `exp_name: pendulum_core`; selection/calibration uses the
# separate `calibration.yaml` namespace `pendulum_core_selection`, so seed-0
# selection artifacts cannot collide with this core grid.
#
# mu_j on-cells are `null` here on purpose: PROTOCOL.md section 5's
# calibration procedure retains one mu_j per family (post-hoc margin sweep,
# not run by this config) -- `sld-factorial` refuses to train a null
# override (value must be filled by calibration first) but `--dry-run`
# still lists the grid with the nulls shown.
#
# lr: set to `null` by arm (like mu_j on on-cells), filled by PROTOCOL.md
# section 2's sweep (calibration.yaml) -- the sweep selects 1 LR from
# {1e-4, 3e-4, 1e-3} via FR val loss on 1 seed, then runs 5 seeds at the
# retained LR.
exp_name: pendulum_core
datasets:
  ou:
    system: {name: DampedPendulum, params: {}}
    regime: {name: OURegime, params: {theta_ou: 1.0}}
    obs: null
    n_episodes: 64
    T: 100
    dt: 0.02
    seed: 0
  action_conditioned:
    system: {name: DampedPendulum, params: {}}
    # K_gain = [[0.8, 0.4]]: the gain tested in
    # tests/data/test_regimes.py::test_action_conditioned_correlation, which
    # produces max |corr(u, x)| > 0.3 (a real action-state correlation).
    regime: {name: ActionConditionedRegime, params: {K_gain: [[0.8, 0.4]], sigma: 0.3}}
    obs: null
    n_episodes: 64
    T: 100
    dt: 0.02
    seed: 0
base:
  d_x: 2
  d_z: 4
  d_u: 1
  target_params: 10000
  # PROTOCOL.md section 10.2 (amendment 1, 2026-07-30): budgets are expressed
  # in OPTIMIZER UPDATES, and the amended 200-update budget applies to the core
  # grid and its achieved-margin audits exactly as it does to the sweeps -- the
  # per-arm fairness law requires one shared budget. The Trainer takes one
  # optimizer step per epoch, so `epochs` IS the update count here.
  epochs: 200
  # PROTOCOL.md section 10.2: step_subsample 0.25 -> 1.0. Inert on off-cells
  # (mu_j == 0 skips the penalty branch entirely; the Trainer canonicalizes it
  # back to the default before hashing there, so off-cell identities are
  # unaffected).
  step_subsample: 1.0
# lr/mu_j filled from the step E selection report
# (_private/research/mu-j-calibration/step_e_report.json, 2026-07-31), run under
# the amended constants. `transformer` and `min_ssm` ON cells keep `mu_j: null`:
# their calibration terminated in PROTOCOL section 5 step 6's "band not reached"
# state, so they cannot enter the core grid until the further dated amendment
# that section 10.4 prescribes. The runner refuses a null override -- that
# refusal is the protocol working, not a bug to route around.
arms:
  - family: mlp
    constraint: "off"
    overrides: {mu_j: 0.0, lr: 1.0e-4}
  - family: mlp
    constraint: "on"
    overrides: {mu_j: 0.01, lr: 1.0e-4}
  - family: transformer
    constraint: "off"
    overrides: {mu_j: 0.0, lr: 1.0e-4}
  - family: transformer
    constraint: "on"
    overrides: {mu_j: null, lr: null}
  - family: min_ssm
    constraint: "off"
    overrides: {mu_j: 0.0, lr: 3.0e-4}
  - family: min_ssm
    constraint: "on"
    overrides: {mu_j: null, lr: null}
  - family: koopman_ssm
    constraint: "off"
    overrides: {mu_j: 0.0, constrained: false, delta: 0.02, lr: 3.0e-4}
  - family: koopman_ssm
    constraint: "on"
    overrides: {mu_j: 0.1, constrained: true, delta: 0.02, lr: 3.0e-4}
seeds: [0, 1, 2, 3, 4]
